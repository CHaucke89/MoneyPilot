name: Build Single Tinygrad Model and Push

on:
  workflow_call:
    inputs:
      upstream_branch:
        description: 'Upstream commit to build from'
        required: true
        type: string
      custom_name:
        description: 'Custom name for the model (no date, only name)'
        required: false
        type: string
      recompiled_dir:
        description: 'Recompiled directory number (e.g. 3 for recompiled3)'
        required: true
        type: string
      artifact_suffix:
        description: 'Suffix for artifact name'
        required: false
        type: string
        default: ''
      bypass_push:
        description: 'Bypass pushing to GitHub for build-all'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream commit to build from'
        required: true
        type: string
      custom_name:
        description: 'Custom name for the model (no date, only name)'
        required: false
        type: string
      recompiled_dir:
        description: 'Recompiled directory number (e.g. 3 for recompiled3)'
        required: true
        type: string

env:
  RECOMPILED_DIR: recompiled${{ inputs.recompiled_dir }}

jobs:
  build_model:
    uses: ./.github/workflows/cloudypilot-build-model.yaml
    with:
      upstream_branch: ${{ inputs.upstream_branch }}
      custom_name: ${{ inputs.custom_name || inputs.upstream_branch }}
      is_20hz: true
      artifact_suffix: ${{ inputs.artifact_suffix }}
    secrets: inherit

  publish_model:
    if: ${{ !inputs.bypass_push && !cancelled() }}
    concurrency:
      group: github-push-models-${{ inputs.recompiled_dir }}
      cancel-in-progress: false
    needs: build_model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact name file
        uses: actions/download-artifact@v4
        with:
          name: artifact-name-${{ inputs.custom_name || inputs.upstream_branch }}
          path: artifact_name

      - name: Read artifact name
        id: read-artifact-name
        run: |
          ARTIFACT_NAME=$(cat artifact_name/artifact_name.txt)
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.read-artifact-name.outputs.artifact_name }}
          path: output

      - name: Remove unwanted files
        run: |
          find output -type f -name 'dmonitoring_model_tinygrad.pkl' -delete
          find output -type f -name 'dmonitoring_model.onnx' -delete

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Publish model to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_NAME="${{ steps.read-artifact-name.outputs.artifact_name }}"

          # Clone the models branch, or create it as an orphan if it doesn't exist yet
          if git clone --depth 1 --branch models \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/CHaucke89/cloudypilot.git" \
              models_repo 2>/dev/null; then
            echo "Cloned existing models branch"
          else
            git clone --depth 1 \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/CHaucke89/cloudypilot.git" \
              models_repo
            cd models_repo
            git checkout --orphan models
            git rm -rf .
            cd ..
          fi

          DEST="models_repo/models/${{ env.RECOMPILED_DIR }}/${ARTIFACT_NAME}"
          mkdir -p "$DEST"

          for path in output/*; do
            [ "$(basename "$path")" = "artifact_name.txt" ] && continue
            name="$(basename "$path")"
            if [ -d "$path" ]; then
              mkdir -p "$DEST/$name"
              cp -r "$path"/* "$DEST/$name/"
              echo "Copied dir $name -> $DEST/$name"
            else
              cp "$path" "$DEST/"
              echo "Copied file $name -> $DEST/"
            fi
          done

          cd models_repo
          git add models/
          git commit -m "Add model ${ARTIFACT_NAME} to ${{ env.RECOMPILED_DIR }}" || echo "No changes to commit"
          git push origin models
